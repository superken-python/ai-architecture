  - id: lab
    title: Lab theo kỹ năng
    desc: Mỗi lab luyện một kỹ năng ở một mức trên dữ liệu nhỏ, làm tới đâu giải thích tới đó. Lab A1–A8 đi kèm từng bài của giai đoạn A.
