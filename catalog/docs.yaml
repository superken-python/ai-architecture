        path: docs/03-giai-doan-a-nen-tang/a4-feature-as-of-ro-ri.md
        desc: Bảng học as-of bằng một câu SQL, bốn loại rò rỉ, test đúng thời điểm, pandera.
        kind: lesson
        step: A4
      - key: stage_a5
        title: A5 · LightGBM, mất cân bằng, ngưỡng theo chi phí
