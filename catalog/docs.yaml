        kind: guide
        stage: A
      - key: stage_a1
        title: A1 · Python, Git và framing
        path: docs/03-giai-doan-a-nen-tang/a1-python-git-framing.md
        desc: Từ 'giảm churn' tới precision@500, giá trị kỳ vọng một cuộc gọi; dự án uv, config, Makefile.
        kind: lesson
        step: A1
      - key: stage_a2
