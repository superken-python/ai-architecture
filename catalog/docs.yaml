      - key: labs
        title: Danh sách lab
        path: labs/README.md
        desc: Quy ước đặt tên, cách thêm lab, danh sách lab theo kỹ năng.
      - key: lab_a1
        title: Lab A1 · Quy bài toán churn ra tiền
        path: labs/biz-01-co-ban-framing-churn/README.md
        desc: Giá trị một khách, xác suất hoà vốn, precision@500 cần đạt — trước khi có model.
        kind: lab
        step: A1
      - key: lab_a2
        title: Lab A2 · Khám phá dữ liệu bằng DuckDB và pandas
        path: labs/data-01-co-ban-kham-pha-du-lieu/README.md
        desc: Lỗi dữ liệu thô, bảng khách-tháng, ASOF JOIN, 5 nhận xét có số liệu.
        kind: lab
        step: A2
      - key: lab_a3
        title: Lab A3 · Khoảng tin cậy bootstrap
        path: labs/stat-02-co-ban-bootstrap/README.md
        desc: Công thức nhanh vs bootstrap, theo khách vs theo dòng, chênh lệch cặp, lời nguyền người thắng.
        kind: lab
        step: A3
      - key: lab_a4
        title: Lab A4 · Feature as-of và bắt rò rỉ
        path: labs/data-03-trung-cap-ro-ri-du-lieu/README.md
        desc: Cố tình gây ba loại rò rỉ (AUC 0,73 → 0,97) rồi bắt bằng bốn cách; backtest cuốn chiếu.
        kind: lab
        step: A4
      - key: lab_a5
        title: Lab A5 · Ngưỡng theo chi phí
        path: labs/stat-05-trung-cap-nguong-chi-phi/README.md
        desc: LightGBM + early stopping, class weight phá xác suất, hiệu chỉnh, đường coverage–precision–lợi nhuận.
        kind: lab
        step: A5
      - key: lab_a6
