# Tài liệu viết tay của repo — nguồn dữ liệu cho trang "Tài liệu" (#/tai-lieu) của web và cho các liên kết chéo.
#
# Trang web mở mọi tài liệu ngay trong trang (khung xem toàn màn hình, render giống GitHub), không chuyển sang GitHub.
# Ngoài việc xếp tài liệu theo nhóm chủ đề, mỗi tài liệu khai báo nó DẠY hoặc LUYỆN gì. Từ đó trang web tự nối:
#   bước lộ trình → bài học + lab của bước;   kỹ năng → bài học, lab, dự án, tài liệu để học nó;
#   nhóm bài toán → dự án + tài liệu;   tổ hợp → dự án;   tài liệu → bước, kỹ năng, nhóm liên quan.
#
# Trường của một tài liệu:
#   key, title, path (file .md trong repo), desc — bắt buộc; tag — nhãn ngắn hiện trên thẻ (tùy chọn).
#   kind    : guide (hướng dẫn giai đoạn) | lesson (bài học) | lab | project (dự án) | report (báo cáo) | doc (mặc định).
#   stage   : id giai đoạn trong roadmap.yaml mà tài liệu là hướng dẫn/dự án chung.
#   step    : id bước trong roadmap.yaml mà tài liệu dạy/luyện — tự kế thừa kỹ năng + mức mục tiêu của bước.
#   skills  : kỹ năng dạy/luyện thêm — id (chỉ liên quan, không nói mức) hoặc {id, level}.
#   groups  : nhóm bài toán (G1…); combos: tổ hợp (CMB-…); domains: mảng kỹ năng (PY, EFF…).
#   pages   : trang web nên gợi ý đọc tài liệu này — lo-trinh | nhom | ky-nang | ma-tran | to-hop | tien-do.
#
# Bộ kiểm tra (make catalog) bảo đảm: file tồn tại, key không trùng, mọi id tham chiếu đều có thật.

version: 1

sections:
