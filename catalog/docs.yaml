        path: docs/03-giai-doan-a-nen-tang/a3-baseline-bo-danh-gia.md
        desc: Chia theo thời gian, đóng băng tập test bằng mã băm, precision@k, bootstrap theo khách.
        kind: lesson
        step: A3
      - key: stage_a4
