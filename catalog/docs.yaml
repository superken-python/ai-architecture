        title: Dự án G1 · Churn nhà mạng Sóng Xanh
        path: projects/g1-churn-telco/README.md
        desc: "Code hoàn chỉnh của 8 bài: dữ liệu thô → bảng học → LightGBM → API Docker → báo cáo."
        tag: Có code chạy được
        kind: project
        stage: A
        groups: [G1]
      - key: g1_report
        title: Báo cáo 1 trang của dự án churn
        path: projects/g1-churn-telco/reports/README.md
