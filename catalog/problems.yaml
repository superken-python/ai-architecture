# Bản đồ bài toán AI trong doanh nghiệp (giai đoạn 1)
# Nguồn: docs/01-problem-map/source/ban-do-bai-toan-ai-doanh-nghiep_v1_20261004.docx
#
# skill_areas = ma trận "Ma trận kỹ năng theo nhóm" (mục 1.3 của tài liệu gốc),
# khóa là mã mảng kỹ năng trong catalog/skills.yaml (domains).
# Mức: core = Cốt lõi, needed = Cần, minor = Ít.
# Bộ kiểm tra (make catalog-check) bảo đảm: mọi ô "core" ở đây đều có ít nhất
# một kỹ năng cùng mảng được đánh dấu core cho nhóm đó → không bỏ sót độ phủ.

version: 1

blocks:
  A: Dự đoán
  B: Hiểu
  C: Hành động
  D: Quyết định
  E: Sáng tạo  # bổ sung 2026-10-20 (không có trong tài liệu gốc): đầu ra là nội dung mới — video, hình, giọng đọc

# Họ bài toán (giai đoạn 2): gom nhóm theo mức chia sẻ kỹ năng thực tế
# (xem "Mức chia sẻ kỹ năng giữa các nhóm" trong ma trận sinh tự động).
# Dùng để phân tầng: kỹ năng "cầu nối" là kỹ năng cần ở CẢ HAI họ.
# Mỗi nhóm phải thuộc đúng một họ.
families:
  - id: structured
    name: Họ dữ liệu có cấu trúc & quyết định
    groups: [G1, G2, G3, G4, G8]
  - id: genai
    name: Họ dữ liệu phi cấu trúc & GenAI
    groups: [G5, G6, G7, G9]

# Nhận diện bài toán trong 30 giây (mục 1.2): đi từ trên xuống, dừng ở câu trả lời "Có" đầu tiên.
# Câu G9 đứng đầu: dây chuyền làm video cũng là "chuỗi thao tác", nên phải tách ra trước câu G7.
identify:
  questions:
    - {q: "Sản phẩm cần giao là nội dung mới để xem hoặc nghe — video, hình ảnh, giọng đọc, nhạc?", group: G9}
    - {q: "Cần thực hiện một chuỗi thao tác trên nhiều hệ thống (đọc, tra cứu, cập nhật, gửi)?", group: G7}
    - {q: "Cần chọn phương án tốt nhất dưới ràng buộc, hoặc đo tác động thật của một hành động?", group: G8}
    - {q: "Cần xếp hạng hoặc gợi ý mục phù hợp cho từng người?", group: G4}
    - {q: "Đầu vào chính là ảnh, video hoặc tài liệu scan?", group: G5}
    - {q: "Đầu vào là văn bản, giọng nói, hoặc cần hỏi đáp trên tài liệu?", group: G6}
    - {q: "Cần dự báo một giá trị trong tương lai theo thời gian?", group: G2}
    - {q: "Cần tìm điểm bất thường khi gần như không có nhãn?", group: G3}
  fallback: G1
  note: Dự án thực tế thường ghép nhiều nhóm — tách thành bài toán con rồi nhận diện từng phần.

groups:
  - id: G1
    slug: g1-du-lieu-bang
    name: Dự đoán trên dữ liệu bảng
    short: Bảng
    block: A
    question: Khách này có rời bỏ, vỡ nợ hay mua hàng không?
    examples: [churn, chấm điểm tín dụng, lead scoring, định giá]
    flow:
      input: Hồ sơ khách hàng, lịch sử giao dịch (dạng bảng)
      technique: "Gradient boosting: LightGBM, XGBoost, CatBoost"
      output: Xác suất rời bỏ hoặc vỡ nợ, giá trị dự đoán
      decision: Chọn khách cần chăm sóc, duyệt hoặc từ chối khoản vay
    levels:
      basic: pandas, SQL, scikit-learn. Chọn đúng metric (AUC, F1 cho phân loại; MAE cho hồi quy), vì accuracy rất dễ đánh lừa khi dữ liệu lệch.
      intermediate: XGBoost/LightGBM/CatBoost, feature engineering, xử lý mất cân bằng, phát hiện data leakage, chia train/test theo thời gian.
      advanced: Hiệu chỉnh xác suất (calibration), giải thích bằng SHAP, chọn ngưỡng theo chi phí của từng loại sai, giám sát drift. Thử TabPFN khi dữ liệu ít.
    metrics: AUC, F1, precision@k (phân loại); MAE, RMSE (hồi quy).
    tools: [pandas, scikit-learn, LightGBM, XGBoost, CatBoost, SHAP]
    pitfalls: Dùng thông tin "tương lai" làm feature (leakage); chia ngẫu nhiên khi dữ liệu có yếu tố thời gian; tối ưu accuracy trên dữ liệu lệch.
    practice_project: "Danh sách 500 khách nên gọi giữ chân mỗi tháng cho CSKH một nhà mạng, mỗi khách kèm 3 lý do dễ hiểu và việc nên làm; phục vụ qua API trong Docker. Đã làm xong — real case của giai đoạn A."
    practice_target: "Gọi trúng nhiều người sắp rời hơn rõ rệt danh sách hiện tại (dự án mẫu: 140 thay vì 37 người mỗi tháng) và quy ra lợi nhuận tăng thêm (dự án mẫu: +44,5 triệu đ/tháng), có khoảng tin cậy."
    practice_data: "Nhà mạng Sóng Xanh — mô phỏng 20.000 khách, 8 bảng vận hành có thời gian và lỗi như thật; luyện thêm trên Telco Customer Churn (IBM, 7.043 khách). Lĩnh vực viễn thông."
    skill_areas: {DATA: core, STAT: core, ML: core, DL: minor, LLM: minor, OPT: minor, OPS: needed, BIZ: core}

  - id: G2
    slug: g2-chuoi-thoi-gian
    name: Dự báo chuỗi thời gian
    short: Thời gian
    block: A
    question: Tháng sau bán (hoặc cần) bao nhiêu?
    examples: [nhu cầu và tồn kho, doanh thu, dòng tiền, lưu lượng cuộc gọi tổng đài]
    flow:
      input: Doanh số theo ngày/tuần, lịch khuyến mãi, Tết và ngày lễ
      technique: ETS/ARIMA, LightGBM toàn cục cho nhiều mã hàng
      output: Dự báo điểm và khoảng dự báo (quantile)
      decision: Đặt hàng, phân bổ tồn kho, xếp nhân sự
    levels:
      basic: Baseline seasonal naive, ETS/ARIMA, metric WAPE và MASE. Backtest cuốn chiếu theo thời gian, không xáo trộn dữ liệu.
      intermediate: Một mô hình LightGBM chung cho hàng nghìn mã hàng, dùng đặc trưng lag, rolling, khuyến mãi, Tết và ngày lễ.
      advanced: Dự báo xác suất (quantile) để ra quyết định tồn kho, dự báo phân cấp (hierarchical reconciliation), mô hình nền tảng như Chronos, TimesFM. Luôn so với baseline.
    metrics: WAPE, MASE; pinball loss cho dự báo quantile.
    tools: [statsforecast, mlforecast, Darts, LightGBM]
    pitfalls: Xáo trộn dữ liệu khi chia train/test; bỏ qua Tết và khuyến mãi; chỉ đưa ra một con số khi quyết định cần khoảng dự báo.
    practice_project: "Dự báo số lượng bán từng ngày trong 28 ngày tới cho mỗi mặt hàng ở mỗi cửa hàng của một chuỗi siêu thị, để đặt hàng không thiếu không thừa; so với cách lấy lại số bán tuần trước."
    practice_target: "Sai số (WAPE) thấp hơn ít nhất 10% so với seasonal naive, giữ được qua ít nhất 3 lần backtest; chỉ ra mặt hàng và thời điểm dự báo kém."
    practice_data: "M5 – Walmart: số bán từng ngày của 3.049 mặt hàng ở 10 cửa hàng trong hơn 5 năm, kèm lịch lễ và giá bán. Lĩnh vực bán lẻ."
    skill_areas: {DATA: core, STAT: core, ML: core, DL: needed, LLM: minor, OPT: needed, OPS: needed, BIZ: core}

  - id: G3
    slug: g3-bat-thuong
    name: Phát hiện bất thường
    short: Bất thường
    block: A
    question: Giao dịch hay máy móc này có gì lạ?
    examples: [gian lận thẻ và ví điện tử, bảo trì dự đoán, giám sát hệ thống IT]
    flow:
      input: Luồng giao dịch, log hệ thống, dữ liệu cảm biến
      technique: Luật nghiệp vụ + Isolation Forest, autoencoder
      output: Điểm bất thường, danh sách cảnh báo xếp hạng
      decision: Chặn giao dịch, cử người kiểm tra, bảo trì sớm
    levels:
      basic: z-score, IQR, luật nghiệp vụ, Isolation Forest.
      intermediate: Kết hợp luật với ML. Đánh giá bằng precision@k, với k là số cảnh báo đội vận hành xử lý được mỗi ngày.
      advanced: Autoencoder, phát hiện gian lận trên đồ thị (mạng lưới tài khoản liên kết), xử lý real-time, học từ phản hồi của người điều tra.
    metrics: precision@k, recall, PR-AUC, tỷ lệ cảnh báo giả.
    tools: [scikit-learn, PyOD, NetworkX, "Kafka (luồng real-time)"]
    pitfalls: Quá nhiều cảnh báo giả khiến đội vận hành bỏ qua cảnh báo; dùng accuracy khi bất thường chiếm dưới 1% dữ liệu.
    practice_project: "Chấm điểm rủi ro từng giao dịch thẻ và chọn ngưỡng cảnh báo vừa sức đội điều tra (ví dụ 500 cảnh báo mỗi ngày), để chặn được nhiều tiền gian lận nhất."
    practice_target: "Với cùng số cảnh báo mỗi ngày, bắt được nhiều gian lận hơn rõ rệt luật đơn giản; báo cáo số tiền chặn được so với chi phí kiểm tra."
    practice_data: "Credit Card Fraud Detection: 284.807 giao dịch thẻ trong 2 ngày ở châu Âu, chỉ 492 gian lận (0,17%). Lĩnh vực ngân hàng."
    skill_areas: {DATA: core, STAT: core, ML: core, DL: needed, LLM: minor, OPT: minor, OPS: core, BIZ: core}

  - id: G4
    slug: g4-goi-y-xep-hang
    name: Gợi ý và xếp hạng
    short: Gợi ý
    block: A
    question: Nên hiển thị gì cho người này?
    examples: [gợi ý sản phẩm, bán chéo bảo hiểm, xếp hạng kết quả tìm kiếm]
    flow:
      input: Lịch sử xem và mua, thông tin sản phẩm và người dùng
      technique: Retrieval (CF, two-tower) rồi ranking (learning-to-rank)
      output: Danh sách top-K riêng cho từng người
      decision: Hiển thị trên app/web, kiểm chứng bằng A/B test
    levels:
      basic: Baseline "phổ biến nhất" hoặc "hay mua cùng", collaborative filtering, metric Recall@K và NDCG.
      intermediate: Kiến trúc 2 tầng retrieval + ranking, learning-to-rank, xử lý cold-start cho người dùng và sản phẩm mới.
      advanced: Mô hình theo chuỗi hành vi (sequential), A/B test đo doanh thu thật, cân bằng nhiều mục tiêu như doanh thu và độ đa dạng.
    metrics: Recall@K, NDCG, MAP (offline); CTR, tỷ lệ chuyển đổi, doanh thu mỗi phiên (online).
    tools: ["implicit (ALS)", LightFM, "LightGBM (LambdaRank)", Faiss]
    pitfalls: Offline tốt nhưng online không tăng; vòng lặp chỉ gợi ý thứ đã phổ biến; quên người dùng và sản phẩm mới.
    practice_project: "Gợi ý 10 phim riêng cho từng người dùng từ lịch sử chấm điểm của mọi người (lọc cộng tác ALS), so với gợi ý 10 phim phổ biến nhất cho tất cả."
    practice_target: "Recall@10 và NDCG@10 cao hơn baseline phổ biến có ý nghĩa thống kê, đo trên các lượt chấm điểm gần nhất; có cách gợi ý cho người dùng mới."
    practice_data: "MovieLens latest-small: 100.836 lượt chấm điểm của 610 người dùng cho 9.742 phim. Lĩnh vực giải trí."
    skill_areas: {DATA: core, STAT: needed, ML: core, DL: needed, LLM: minor, OPT: minor, OPS: core, BIZ: needed}

  - id: G5
    slug: g5-anh-tai-lieu
    name: Thị giác máy tính và Document AI
    short: Ảnh/TL
    block: B
    question: Trong ảnh hay tài liệu này có gì?
    examples: ["eKYC (đọc giấy tờ tùy thân, so khớp khuôn mặt)", kiểm tra lỗi sản phẩm, "trích xuất hóa đơn, hợp đồng, chứng từ"]
    flow:
      input: Ảnh, video, PDF scan, ảnh chụp giấy tờ
      technique: Detection, OCR, VLM (mô hình thị giác–ngôn ngữ)
      output: Nhãn, vùng lỗi, trường dữ liệu có cấu trúc
      decision: Tự động duyệt hồ sơ, loại sản phẩm lỗi
    levels:
      basic: Transfer learning, YOLO cho phát hiện vật thể, OCR có sẵn. Metric gồm mAP, IoU và độ chính xác theo từng trường thông tin.
      intermediate: Chiến lược gán nhãn, augmentation, segmentation. Dùng VLM để trích xuất tài liệu có nhiều mẫu khác nhau.
      advanced: Triển khai trên thiết bị biên (ONNX, TensorRT, quantization), active learning, xử lý ảnh chất lượng xấu ngoài thực tế. Đo tỷ lệ hồ sơ được xử lý tự động hoàn toàn.
    metrics: mAP, IoU; độ chính xác theo từng trường; tỷ lệ hồ sơ xử lý tự động hoàn toàn.
    tools: [PyTorch, Ultralytics YOLO, OpenCV, PaddleOCR, VietOCR, Label Studio, ONNX Runtime]
    pitfalls: Dữ liệu huấn luyện quá "sạch" so với ảnh chụp thực tế; chỉ đo độ chính xác chung thay vì theo từng trường.
    practice_project: "Tự động lấy ngày, tổng tiền, mã số thuế từ ảnh hoá đơn cho phòng kế toán; so cách OCR + luật với model đọc ảnh (VLM) về độ chính xác và chi phí; hoá đơn không chắc chắn chuyển người kiểm tra."
    practice_target: "Mỗi trường đúng ít nhất 95% trên phần hệ thống tự xử lý, phần còn lại chuyển người; bộ đánh giá ít nhất 100 hoá đơn có đáp án."
    practice_data: "Hoá đơn tự chụp (50–100 tấm, đã che thông tin cá nhân) + MC-OCR 2021: 2.436 ảnh hoá đơn bán lẻ tiếng Việt. Lĩnh vực kế toán."
    skill_areas: {DATA: minor, STAT: minor, ML: minor, DL: core, LLM: needed, OPT: minor, OPS: core, BIZ: needed}

  - id: G6
    slug: g6-llm-rag
    name: Ngôn ngữ, LLM và RAG
    short: LLM/RAG
    block: B
    question: Văn bản này nói gì? Trả lời dựa trên tài liệu nội bộ.
    examples: [phân loại và chuyển ticket, tóm tắt cuộc gọi, chatbot CSKH, trợ lý tra cứu quy trình nội bộ, "hỏi số liệu bằng ngôn ngữ tự nhiên (text-to-SQL)"]
    flow:
      input: Tài liệu nội bộ, ticket, email, ghi âm cuộc gọi
      technique: LLM + truy xuất (hybrid search, rerank), ASR cho giọng nói
      output: Câu trả lời có trích dẫn, nhãn, JSON có cấu trúc
      decision: Giải đáp khách hàng, chuyển ticket đúng bộ phận
    levels:
      basic: Prompt engineering, structured output theo JSON schema. Phân loại văn bản bằng LLM hoặc fine-tune encoder nhỏ như PhoBERT.
      intermediate: RAG đầy đủ (parse PDF và bảng, chunking, hybrid search, reranking, trích dẫn nguồn). Xây golden set để đo retrieval recall, faithfulness và độ đúng, rồi chọn model theo độ khó và chi phí.
      advanced: Fine-tune (LoRA, SFT, DPO), distill sang model nhỏ cho rẻ, tự host model open-weight bằng vLLM, phân quyền tài liệu theo người dùng. Dùng LLM-as-judge đã đối chiếu với nhãn của người. Thêm ASR (như Whisper) cho bài toán tổng đài.
    metrics: Retrieval recall@k, faithfulness, độ đúng câu trả lời; chi phí và độ trễ mỗi câu hỏi.
    tools: [LLM API, Hugging Face Transformers, Qdrant hoặc pgvector, BM25, vLLM, Langfuse]
    pitfalls: Không có bộ đánh giá nên chỉ "cảm thấy tốt"; parse PDF và bảng kém làm hỏng cả hệ; lộ tài liệu cho người không có quyền.
    practice_project: "Trợ lý hỏi đáp trên quy định (Bộ luật Lao động hoặc quy chế công khai của một tổ chức): tìm đúng đoạn rồi mới trả lời bằng tiếng Việt, luôn trích điều luật làm căn cứ, không bịa."
    practice_target: "Golden set khoảng 100 câu: điều luật đúng nằm trong 5 đoạn lấy ra ở ít nhất 90% câu, trả lời đúng ít nhất 85%, 100% có trích dẫn; biết chi phí mỗi câu."
    practice_data: "Bộ luật Lao động 2019: 17 chương, 220 điều về hợp đồng, tiền lương, thời giờ làm việc, nghỉ phép. Lĩnh vực pháp luật, nhân sự."
    skill_areas: {DATA: needed, STAT: needed, ML: minor, DL: needed, LLM: core, OPT: minor, OPS: core, BIZ: needed}

  - id: G7
    slug: g7-agent-tu-dong-hoa
    name: AI Agent và tự động hóa quy trình
    short: Agent
    block: C
    question: Làm giúp tôi cả chuỗi việc này.
    examples: [xử lý hồ sơ vay từ đầu đến cuối, đối soát, trợ lý thao tác trên CRM/ERP, tự động lập báo cáo, "trợ lý AI ngay trong Excel/Office (add-in) gọi agent của hệ thống"]
    flow:
      input: "Yêu cầu của người dùng + công cụ: API, CRM, ERP"
      technique: LLM gọi công cụ (tool calling, MCP) theo workflow
      output: Chuỗi hành động đã thực hiện, log và kết quả
      decision: Hoàn tất quy trình; người duyệt ở bước rủi ro
    levels:
      basic: Tool/function calling, workflow cố định (chuỗi bước LLM xen code), có người duyệt ở bước rủi ro.
      intermediate: Orchestration bằng LangGraph hoặc agent SDK của các hãng, MCP để kết nối công cụ và dữ liệu, quản lý state/context, guardrails, tracing.
      advanced: Đánh giá cả quá trình agent thực hiện (trajectory) chứ không chỉ kết quả cuối, multi-agent, computer-use, bảo mật (prompt injection, cấp quyền tối thiểu).
    metrics: Tỷ lệ hoàn thành nhiệm vụ; chi phí và số bước mỗi nhiệm vụ; tỷ lệ cần người can thiệp; số lỗi nghiêm trọng.
    tools: [LangGraph, agent SDK của các hãng, MCP, Langfuse]
    pitfalls: Dùng agent tự chủ cho việc mà workflow cố định làm tốt hơn; cấp quyền quá rộng; không ghi log được agent đã làm gì.
    practice_project: "Agent đọc email hỏi giá, nhận ra mặt hàng và số lượng, tra bảng giá, soạn báo giá rồi dừng chờ người duyệt trước khi gửi."
    practice_target: "Đúng mặt hàng và số lượng ở ít nhất 90% email, 100% giá lấy từ bảng giá, không báo giá nào gửi khi chưa duyệt, mọi bước có nhật ký."
    practice_data: "Tự tạo: 30–50 email hỏi giá tiếng Việt nhiều tình huống + bảng giá CSV + đáp án cho từng email. Lĩnh vực bán hàng B2B."
    principle: Dùng workflow đơn giản nhất chạy được; chỉ dùng agent tự chủ khi bài toán thật sự cần.
    skill_areas: {DATA: needed, STAT: minor, ML: minor, DL: minor, LLM: core, OPT: minor, OPS: core, BIZ: core}

  - id: G8
    slug: g8-toi-uu-nhan-qua
    name: Tối ưu hóa và suy luận nhân quả
    short: Tối ưu
    block: D
    question: Nên làm gì là tốt nhất?
    examples: [tuyến giao hàng, xếp ca, định giá khuyến mãi, phân bổ ngân sách marketing]
    flow:
      input: Dự báo, ràng buộc (xe, ca, ngân sách), dữ liệu thí nghiệm
      technique: LP/MIP, uplift modeling, suy luận nhân quả
      output: Phương án tối ưu, ước lượng tác động thật
      decision: Lộ trình xe, lịch ca, chọn khách cần tác động
    levels:
      basic: A/B test đúng cách (cỡ mẫu, ý nghĩa thống kê), quy hoạch tuyến tính với OR-Tools.
      intermediate: Quy hoạch nguyên (MIP) cho xếp lịch và định tuyến xe (VRP). Kết hợp "dự báo rồi tối ưu", dùng uplift modeling để chọn đúng khách cần tác động.
      advanced: Causal inference (DoWhy, EconML, difference-in-differences), multi-armed bandit.
    metrics: Chi phí hoặc lợi nhuận so với cách làm hiện tại; mức tăng (uplift) có ý nghĩa thống kê; mức vi phạm ràng buộc.
    tools: [OR-Tools, PuLP, Pyomo, DoWhy, EconML, CausalML]
    pitfalls: Nhầm tương quan với nhân quả; tối ưu trên dự báo một điểm mà bỏ qua bất định; dừng A/B test sớm khi thấy kết quả đẹp.
    practice_project: "Xếp tuyến giao hàng cho 1 kho và 20 điểm bằng OR-Tools (đúng tải trọng xe, khung giờ khách); và đo tác động thật của email khuyến mãi để chọn khách nên gửi."
    practice_target: "Tổng quãng đường ngắn hơn ít nhất 15% so với tuyến hiện tại, 100% đúng ràng buộc; chọn nhóm khách để gửi mà lợi nhuận cao hơn gửi cho tất cả."
    practice_data: "Toạ độ giao hàng tự sinh (logistics) + Hillstrom: 64.000 khách được chia ngẫu nhiên nhận hoặc không nhận email khuyến mãi (marketing)."
    principle: Dự đoán chưa tạo ra tiền, quyết định mới tạo ra tiền — nhóm này là cầu nối từ model đến lợi nhuận.
    skill_areas: {DATA: needed, STAT: core, ML: needed, DL: minor, LLM: minor, OPT: core, OPS: needed, BIZ: core}

  # Bổ sung 2026-10-20 (không có trong tài liệu gốc v1): bài toán TẠO nội dung. Khác G7 (đầu ra là hành động) và
  # G5/G6 (đầu ra là hiểu biết về nội dung có sẵn). Dự án mẫu: projects/g9-video-chu-cai.
  - id: G9
    slug: g9-tao-noi-dung
    name: Tạo nội dung đa phương tiện
    short: Nội dung
    block: E
    question: Làm giúp tôi video, hình ảnh hay giọng đọc này.
    examples: [video bài giảng và e-learning, video giới thiệu sản phẩm, giọng đọc và lồng tiếng tự động, ảnh minh họa và nhân vật thương hiệu]
    flow:
      input: Kịch bản hoặc bài học, nhân vật và nhận diện thương hiệu, dữ liệu sản phẩm
      technique: LLM viết kịch bản; TTS; mô hình sinh ảnh/video; dựng hình bằng code (ffmpeg, Pillow, Remotion)
      output: Video, ảnh, giọng đọc đúng nội dung và đúng nhân vật
      decision: Duyệt rồi đăng lên kênh học tập, mạng xã hội, website
    levels:
      basic: Dựng video bằng code từ ảnh có sẵn (Pillow/ffmpeg) + giọng TTS + phụ đề; chữ trên hình do code vẽ từ kịch bản; người duyệt trước khi đăng.
      intermediate: Dây chuyền chạy lại được bằng một lệnh (kịch bản → giọng → nhạc → hình), nhân vật nhất quán, máy tự nghe lại lời đọc (ASR) và báo câu cần sửa; đo thời gian và chi phí mỗi phút video.
      advanced: Mô hình sinh ảnh/video có ảnh tham chiếu (giữ nhân vật qua nhiều cảnh), giọng hoặc LoRA nhân vật riêng, sản xuất hàng loạt, kiểm duyệt nội dung và bản quyền, đo hiệu quả thật (tỷ lệ xem hết, kết quả học).
    metrics: Tỷ lệ câu đọc đúng (máy nghe lại + người nghe); lỗi chữ trên hình; tỷ lệ video được duyệt ngay lần đầu; thời gian và chi phí mỗi phút video; tỷ lệ xem hết.
    tools: [Claude Code, ffmpeg, Pillow, Remotion, "Piper / sherpa-onnx", "TTS thương mại (FPT.AI, Google, Azure, ElevenLabs)", "Kling, Veo, Sora"]
    pitfalls: Để mô hình sinh vẽ chữ (sai dấu tiếng Việt); tin giọng TTS mà không nghe lại; nhân vật lệch nét giữa các cảnh; quên bản quyền nhân vật, nhạc, giọng đọc; nội dung cho trẻ em không có người duyệt.
    practice_project: "Video 3 phút dạy 29 chữ cái tiếng Việt trên nền nhạc: bảng học ở giữa, hai nhân vật cử động (tách nền từ video Gemini) đứng hai góc; dựng bằng code (kịch bản YAML → giọng đọc → nhạc → hình) và tự kiểm tra lời đọc bằng ASR. Đã làm — dự án g9-video-chu-cai."
    practice_target: "Một lệnh dựng lại cả video (~3 phút, không tốn phí API); ≥ 90% câu đọc được máy nghe lại đúng cả khi có nhạc (hiện tại: 28/29); 100% chữ trên hình đúng chính tả; giáo viên duyệt."
    practice_data: "Tự tạo: kịch bản 29 chữ cái (cách đọc âm, từ ví dụ), hai video nhân vật tạo bằng Gemini; hình Noto Emoji (Apache 2.0); giọng Piper vi_VN vais1000 (dữ liệu VAIS-1000, CC BY 4.0). Lĩnh vực giáo dục."
    principle: Chữ, số và lời dạy phải đúng tuyệt đối — để code vẽ chữ và máy nghe lại lời đọc; AI lo phần giọng và hình.
