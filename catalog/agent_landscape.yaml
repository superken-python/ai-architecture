# Lớp hỗ trợ: không phải framework agent nhưng quyết định chất lượng khi chạy thật.
supporting:
  - {id: mcp, name: MCP (Model Context Protocol) SDK, layer: protocol, packages: {pypi: [mcp]}, ring: adopt,
