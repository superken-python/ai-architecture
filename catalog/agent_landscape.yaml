# Radar framework & công cụ cho Nhóm 7 (AI Agent và tự động hóa) — dữ liệu do NGƯỜI duyệt.
#
# Số liệu tự động (phiên bản, ngày phát hành, giấy phép trên registry, số bản major 12 tháng, sao GitHub) KHÔNG ghi ở
# đây: `make landscape-refresh` kéo về catalog/agent_landscape.snapshot.json, `make landscape` sinh bảng trong
# docs/agent-radar/generated/. Quy trình cập nhật: docs/agent-radar/README.md §6.
#
# Quy ước
#   ring:      adopt (dùng mặc định trong repo) · trial (đáng dùng thử cho dự án phù hợp) · assess (theo dõi, thử nhỏ)
#              · hold (không chọn cho việc mới)
#   features:  yes · partial · no · "?" (chưa kiểm). Ý nghĩa từng cột: docs/agent-radar/README.md §2
#   verified:  source (đã đọc mã nguồn) · docs (tài liệu/registry chính thức) · secondary (blog, bài so sánh, hiểu biết
#              chung — cần kiểm lại trước khi dựa vào)
#   reviewed:  ngày người duyệt nội dung của mục này (không phải ngày kéo số liệu)

version: 1
reviewed: 2026-10-14

categories:
  orchestration: Điều phối bằng đồ thị / workflow — luồng do code định nghĩa
  sdk: SDK agent gọn — vòng lặp tool do model dẫn
  vendor: SDK của nhà cung cấp model
  runtime: Runtime đầy đủ — API, session, UI, trace đi kèm
  multi_agent: Đa agent theo vai trò / hội thoại
  data: Agent xoay quanh dữ liệu, RAG, tối ưu prompt
  typescript: Hệ TypeScript

feature_columns:
  routing: Điều hướng (graph = code định nghĩa nhánh; llm = model chọn agent/tool)
  hitl: Tạm dừng chờ người duyệt / nhập liệu
  durable: Chạy bền (resume sau lỗi, checkpoint lưu DB)
  otel: Phát trace OpenTelemetry
  mcp: Dùng MCP server làm tool
  a2a: Giao thức A2A
  agui: Giao thức AG-UI (frontend tools, stream sự kiện tới giao diện)
  eval: Công cụ eval đi kèm

frameworks:
  - id: agno
    name: Agno + AgentOS
    category: runtime
    lang: [python]
    packages: {pypi: [agno]}
    repo: agno-agi/agno
    license_note: SDK + runtime Apache-2.0; control plane os.agno.com trả phí (không bắt buộc)
    ring: adopt
    features: {routing: both, hitl: "yes", durable: partial, otel: "yes", mcp: "yes", a2a: "yes", agui: "yes", eval: "yes"}
    strengths:
      - AgentOS có sẵn API/SSE, session lưu DB, JWT/RBAC, trace, MCP client + server, A2A, Skills
      - Frontend tools qua AG-UI chạy sẵn (run tạm dừng → client chạy tool → chạy tiếp), trạng thái lưu ở server
      - Workflows (bước, router, điều kiện, vòng lặp) cho luồng cố định; Team cho điều hướng bằng model
    weaknesses:
      - Đổi API nhanh (2.0 09/2025 → 3.0 08/2026) — cần khóa phiên bản và test hồi quy
      - Thành viên của Team không nhận frontend tools (3.1.3) — agent dùng tool phía client phải là agent chạy trực tiếp
    choose_when: Cần runtime đầy đủ nhanh, agent nối giao diện (add-in, web) qua AG-UI, dùng chung với CMB-09
    used_in: [CMB-10 (POC 0.2, ADR-09), CMB-09 (thiết kế)]
    verified: source
    reviewed: 2026-10-14
    sources:
      - projects/cmb-10-excel-agent-addin/docs/05-adr-runtime-agent.md
      - https://github.com/agno-agi/agno

  - id: langgraph
    name: LangGraph
    category: orchestration
    lang: [python, typescript]
    packages: {pypi: [langgraph], npm: ["@langchain/langgraph"]}
    repo: langchain-ai/langgraph
    license_note: Thư viện MIT; server langgraph-api là Elastic-2.0 (không phải OSI); LangSmith trả phí
    ring: trial
    features: {routing: both, hitl: "yes", durable: "yes", otel: partial, mcp: "yes", a2a: partial, agui: "yes", eval: partial}
    strengths:
      - Luồng là đồ thị code định nghĩa — điều hướng chính xác, dễ kiểm toán
      - Checkpointer (PostgreSQL), interrupt chờ người duyệt, xem lại/quay lui từng bước — trưởng thành nhất
      - Cộng đồng và tài liệu lớn nhất; bản Python và TypeScript
    weaknesses:
      - Viết dài hơn SDK gọn; tracing/eval tốt nhất nằm ở LangSmith (thương mại)
      - Frontend tools qua AG-UI phải tự nối vào state của graph
    choose_when: Luồng nhiều bước, nhiều nhánh, cần audit và duyệt người (ngân hàng, bảo hiểm, đối soát)
    used_in: []
    verified: source
    reviewed: 2026-10-14
    sources:
      - projects/cmb-10-excel-agent-addin/docs/05-adr-runtime-agent.md
      - https://github.com/langchain-ai/langgraph

