[project]
name = "excel-agent-poc"
version = "0.1.0"
description = "POC CMB-10: chat AG-UI qua AgentOS, agent viết bằng OpenAI Agents SDK, xuất file Excel, xem dữ liệu, /search và apply vào cột"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents==0.23.1",
    "agno[os,agui,sqlite]==3.1.3",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
e2e = [
    "playwright==1.56.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["e2e: kiểm thử giao diện bằng trình duyệt thật (cần `make setup-e2e`)"]
