[tool.poetry]
name = "gemini-excel-ai-agent"
version = "1.0.0"
description = "Excel Enterprise AI Agent Copilot nhúng Office.js và AgentOS Agno SDK với Azure OpenAI"
authors = ["Motives AI Architecture Team"]
readme = "README.md"
packages = [{include = "excel_agent", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
pydantic = ">=2.9.0"
pydantic-settings = ">=2.5.0"
sqlmodel = ">=0.0.22"
loguru = ">=0.7.2"
pyyaml = ">=6.0.2"
openai = ">=1.50.0"
httpx = ">=0.27.0"
langfuse = ">=2.50.0"
agno = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
ruff = ">=0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"
