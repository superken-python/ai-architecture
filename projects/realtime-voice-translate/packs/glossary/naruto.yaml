# Quy ước xưng hô khi dịch sang tiếng Việt: tiếng Nhật hay bỏ chủ ngữ, tiếng Việt phải chọn đại từ (docs 09 §9)
addressing:
  vi:
    - "Naruto, Sakura nói với nhau và với bạn cùng lứa: xưng 'tớ', gọi 'cậu'."
    - "Sasuke lạnh lùng: xưng 'tôi', gọi người khác là 'cậu'."
    - "Học trò nói với Kakashi hoặc Iruka: xưng 'em', gọi 'thầy'."
    - "Kakashi nói với học trò: xưng 'thầy', gọi 'các em' hoặc 'em'."
    - "Người lớn nói với Hokage: xưng 'tôi', gọi 'ngài'. Hokage xưng 'ta'."
    - "Khi chửi nhau hoặc nói với chính phân thân của mình: 'tao/mày'."
