name: "balanced"
description: "Default balanced production profile for 8GB GPU"
vad:
  engine: "silero"
  # Silero mặc định 0.5/0.35; tạm hạ còn 0.4/0.25 vì chưa có AGC ở server (đợt 2) — mô phỏng mức thu thấp ở 2 m:
  # 48% → 69% câu được ghi nhận, không tăng bắt nhầm nhiễu. Chỉnh lại sau khi đo thu xa (docs/04 §7).
  threshold: 0.4
  neg_threshold: 0.25
  min_speech_ms: 200
  min_silence_ms: 500
  speech_pad_ms: 200
  preroll_ms: 400
  max_ms: 4000
  hard_max_ms: 6000
  partial_interval_ms: 800
asr:
  engine: "faster-whisper"
  model: "large-v3-turbo"
  device: "cuda"
  compute_type: "int8_float16"
mt:
  engine: "llama-cpp"
  model: "qwen2.5-7b-instruct-q4_k_m"
  temperature: 0.1
  top_p: 0.7
  max_tokens: 384
