name: "cpu-dev"
description: "CPU development profile with small real models"
vad:
  engine: "silero"
  # Silero mặc định 0.5/0.35; tạm hạ còn 0.4/0.25 vì chưa có AGC ở server (đợt 2) — mô phỏng mức thu thấp ở 2 m:
  # 48% → 69% câu được ghi nhận, không tăng bắt nhầm nhiễu. Chỉnh lại sau khi đo thu xa (docs/04 §7).
  threshold: 0.4
  neg_threshold: 0.25
  min_speech_ms: 200
  min_silence_ms: 500
  speech_pad_ms: 200
  preroll_ms: 400
asr:
  engine: "faster-whisper"
  model: "tiny"
  device: "cpu"
  compute_type: "int8"
mt:
  engine: "llama-cpp"
  model: "fake"
  temperature: 0.1
  max_tokens: 256
