# Nghe trên GPU 8 GB, dịch qua API trên cloud (Azure OpenAI / OpenAI) — docs 10 §13.
# Không có container Qwen (mt): cả GPU dành cho phần nghe. Khởi động: ./start.sh --api-mt
# Đặt trong .env ở thư mục dự án (hoặc export trên shell):
#   RVT_MT_API_URL="https://<resource>.cognitiveservices.azure.com/openai/deployments/<deployment>/chat/completions?api-version=..."
#   RVT_MT_API_KEY=...        (không commit)
services:
  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: rvt_ai
    runtime: nvidia
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - RVT_USE_FAKE=0
      - RVT_MODELS_DIR=/models
      - RVT_PROFILE=api-mt
      - RVT_MT_API_URL=${RVT_MT_API_URL:-}
      - RVT_MT_API_KEY=${RVT_MT_API_KEY:-}
      - RVT_MT_MODEL=${RVT_MT_MODEL:-}
      - RVT_MT_PROVIDER=${RVT_MT_PROVIDER:-}
      - RVT_MT_REASONING_EFFORT=${RVT_MT_REASONING_EFFORT:-auto}
      # API trên cloud chậm hơn llama.cpp trong máy: chờ lâu hơn trước khi coi là lỗi
      - RVT_MT_TIMEOUT_SEC=${RVT_MT_TIMEOUT_SEC:-20}
      - RVT_GLOSSARIES=${RVT_GLOSSARIES:-default}
      - RVT_VAD_PROBE=${RVT_VAD_PROBE:-true}
      - RVT_ASR_FINAL_BEAM_SIZE=${RVT_ASR_FINAL_BEAM_SIZE:-1}
      # Đổi model nhận dạng theo ngôn ngữ, ví dụ "ja=large-v3" (docs 10 §13.6)
      - RVT_ASR_MODELS=${RVT_ASR_MODELS:-}
    volumes:
      - ../models:/models
      - ../config:/app/config:ro
      - ../packs:/app/packs:ro
      - ../prompts:/app/prompts:ro
      - ../ai/src:/app/src:ro
      - ../eval:/app/eval:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 60s
    networks:
      - rvt_web_net

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: rvt_web
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ../config/tls:/etc/nginx/tls:ro
    depends_on:
      ai:
        condition: service_healthy
    networks:
      - rvt_web_net

networks:
  rvt_web_net:
    name: rvt_web_net
