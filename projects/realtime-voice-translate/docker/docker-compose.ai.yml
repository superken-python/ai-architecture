services:
  mt:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: rvt_mt
    runtime: nvidia
    restart: unless-stopped
    command: >-
      -m /models/${RVT_MT_MODEL_FILE:-qwen2.5-7b-instruct-q5_k_m.gguf}
      --host 0.0.0.0
      --port 8080
      -c 8192
      --parallel 4
      -ngl 99
    volumes:
      - ../models:/models:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend

  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: rvt_ai
    runtime: nvidia
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - RVT_USE_FAKE=0
      - RVT_MODELS_DIR=/models
      - RVT_MT_API_URL=http://mt:8080/v1
      # Glossary cho bộ dịch, ví dụ "default,naruto" (docs 09 §5.2)
      - RVT_GLOSSARIES=${RVT_GLOSSARIES:-default}
      # Dò vùng audio to mà VAD bỏ sót khi thu âm tab (docs 09 §4.1)
      - RVT_VAD_PROBE=${RVT_VAD_PROBE:-true}
      - RVT_PROFILE=balanced
    volumes:
      - ../models:/models
      - ../config:/app/config:ro
      - ../packs:/app/packs:ro
      - ../prompts:/app/prompts:ro
      - ../ai/src:/app/src:ro
      # Bộ đo (golden, mt_eval.py, golden_session.py) chạy bằng docker exec rvt_ai (docs 09)
      - ../eval:/app/eval:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      mt:
        condition: service_started
    networks:
      - backend
      - rvt_web_net

networks:
  backend:
    name: rvt_backend_net
    internal: true
  rvt_web_net:
    name: rvt_web_net
