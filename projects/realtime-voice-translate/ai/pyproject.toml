[project]
name = "ai"
version = "0.1.0"
description = "Realtime Voice Translate AI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "faster-whisper>=1.0.1",
    "onnxruntime>=1.17.1",
    "numpy<2.0.0",
    "jinja2>=3.1.3",
    "pyyaml>=6.0.1",
    "loguru>=0.7.3",
    "python-multipart>=0.0.32",
]

[tool.pytest.ini_options]
addopts = "-v --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
