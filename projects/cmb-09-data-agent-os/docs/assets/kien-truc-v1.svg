  <text x="125" y="452" class="cl mid">AgentOS phục vụ cả /mcp</text>
  <rect x="38" y="485" width="174" height="62" rx="10" fill="#ffffff" class="new"/>
  <text x="125" y="512" class="ct mid">Người review</text>
  <text x="125" y="532" class="cl mid">đánh giá, duyệt learning</text>

  <!-- Request / Response -->
  <text x="280" y="254" class="lblb mid">Request</text>
  <text x="280" y="270" class="lbl mid" font-size="11">question,</text>
  <text x="280" y="284" class="lbl mid" font-size="11">agent_id?,</text>
  <text x="280" y="298" class="lbl mid" font-size="11">session_id, JWT</text>
  <line x1="234" y1="310" x2="326" y2="310" class="arrow" marker-end="url(#arr)"/>
  <line x1="326" y1="372" x2="234" y2="372" class="arrow" marker-end="url(#arr)"/>
  <text x="280" y="394" class="lblb mid">Response</text>
  <text x="280" y="410" class="lbl mid">answer, run_id,</text>
  <text x="280" y="424" class="lbl mid">references [Q1..]</text>
  <line x1="234" y1="516" x2="326" y2="516" class="arrow-dash" marker-end="url(#arr-o)"/>
  <text x="280" y="538" class="lbl mid">review / approve</text>

  <!-- ═════ AgentOS Platform ═════ -->
  <rect x="330" y="100" width="950" height="740" rx="16" fill="#f7f3fe" stroke="#c9b6f2" stroke-width="1.5"/>
  <text x="805" y="140" class="mid" font-size="26" font-weight="700" style="fill:#3b1f7a">AgentOS (Platform)</text>
  <text x="805" y="166" class="mid" font-size="15" style="fill:#57606a">Manage • Deploy • Orchestrate • Monitor • Secure • Learn</text>

  <rect x="350" y="185" width="170" height="118" rx="10" class="card"/>
  <text x="435" y="214" class="ct mid">Agent Registry</text>
  <text x="435" y="240" class="cl mid">agent_id → pack@version</text>
  <text x="435" y="258" class="cl mid">runtime · model · status</text>
  <text x="435" y="276" class="cl mid">(config/agents.yaml)</text>

  <rect x="535" y="185" width="170" height="118" rx="10" class="card"/>
  <rect x="628" y="176" width="70" height="18" rx="9" class="badge-upd"/>
  <text x="663" y="189" class="badge-txt">CẬP NHẬT</text>
  <text x="620" y="214" class="ct mid">Orchestrator</text>
  <text x="620" y="240" class="cl mid">Router: từ khóa → LLM</text>
  <text x="620" y="258" class="cl mid">→ hỏi lại nếu mơ hồ</text>
  <text x="620" y="276" class="cl mid">Workflow báo cáo + lịch</text>

  <rect x="720" y="185" width="170" height="118" rx="10" class="card"/>
  <rect x="813" y="176" width="70" height="18" rx="9" class="badge-upd"/>
  <text x="848" y="189" class="badge-txt">CẬP NHẬT</text>
  <text x="805" y="214" class="ct mid">Auth &amp; RBAC</text>
  <text x="805" y="240" class="cl mid">JWT (AgentOS authz):</text>
  <text x="805" y="258" class="cl mid">ai được gọi agent nào</text>
  <text x="805" y="276" class="cl mid">role → pack/bảng/cột</text>

  <rect x="905" y="185" width="170" height="118" rx="10" class="card"/>
  <rect x="998" y="176" width="70" height="18" rx="9" class="badge-upd"/>
  <text x="1033" y="189" class="badge-txt">CẬP NHẬT</text>
  <text x="990" y="214" class="ct mid">Observability</text>
  <text x="990" y="240" class="cl mid">Traces 2 runtime → 1 DB</text>
  <text x="990" y="258" class="cl mid">Evidence · Metrics</text>
  <text x="990" y="276" class="cl mid">Evals theo pack/version</text>

  <rect x="1090" y="185" width="170" height="118" rx="10" fill="#ffffff" class="new"/>
  <rect x="1214" y="176" width="40" height="18" rx="9" class="badge-new"/>
  <text x="1234" y="189" class="badge-txt">MỚI</text>
  <text x="1175" y="214" class="ct mid">Review &amp; Learning</text>
  <text x="1175" y="240" class="cl mid">đánh giá + sửa câu trả lời</text>
  <text x="1175" y="258" class="cl mid">→ learning (đề xuất)</text>
  <text x="1175" y="276" class="cl mid">duyệt → nạp lại vào pack</text>

  <!-- Agent Runtime -->
  <rect x="350" y="320" width="910" height="325" rx="12" fill="#f1ebfc" stroke="#c9b6f2" stroke-width="1.2"/>
  <text x="805" y="349" class="mid" font-size="20" font-weight="700" style="fill:#5b2bb5">Agent Runtime (via SDK)</text>
  <text x="805" y="371" class="cm mid">Chạy agent bằng Agno hoặc OpenAI Agents SDK — cùng domain pack, cùng bộ data tool, cùng trace store</text>

  <rect x="370" y="385" width="870" height="52" rx="10" fill="#fff7ef" class="new"/>
  <rect x="1194" y="376" width="40" height="18" rx="9" class="badge-new"/>
  <text x="1214" y="389" class="badge-txt">MỚI</text>
  <text x="805" y="406" class="ct2 mid">Pack Resolver + Context Builder (dùng chung cho cả 2 runtime)</text>
  <text x="805" y="426" class="cl mid">nạp CORE (data agent) trước → domain pack → learnings đã duyệt · kỹ năng core (khóa) không bị ghi đè · chỉ đưa tên + mô tả skill vào prompt</text>

  <rect x="370" y="450" width="425" height="115" rx="10" fill="#e9f7ef" stroke="#8fd0aa" stroke-width="1.5"/>
  <text x="582" y="478" class="mid" font-size="16" font-weight="700" style="fill:#16733f">Agno Agent SDK — runtime chính</text>
  <text x="582" y="502" class="cm mid">Agents • Teams (route) • Workflows</text>
  <text x="582" y="522" class="cm mid">Skills (SKILL.md, native) • Memory • Knowledge</text>
  <text x="582" y="542" class="cm mid">Tracing OpenTelemetry → traces/spans</text>

  <rect x="815" y="450" width="425" height="115" rx="10" fill="#eef4fd" stroke="#9fbfe8" stroke-width="1.5"/>
  <rect x="1164" y="441" width="70" height="18" rx="9" class="badge-upd"/>
  <text x="1199" y="454" class="badge-txt">CẬP NHẬT</text>
  <text x="1027" y="478" class="mid" font-size="16" font-weight="700" style="fill:#1f4f99">OpenAI Agents SDK — runtime phụ</text>
  <text x="1027" y="502" class="cm mid">Agents • Handoffs • Guardrails • (Sandbox khi cần)</text>
  <text x="1027" y="522" class="cm mid">skills qua tool load_skill — không cần sandbox</text>
  <text x="1027" y="542" class="cm mid">vào AgentOS qua OpenAIAgentsAdapter</text>

  <rect x="370" y="578" width="870" height="52" rx="10" fill="#fff7ef" class="new"/>
  <rect x="1194" y="569" width="40" height="18" rx="9" class="badge-new"/>
  <text x="1214" y="582" class="badge-txt">MỚI</text>
  <text x="805" y="599" class="ct2 mid">Data tools dùng chung (định nghĩa một lần, bọc cho Agno Function và OpenAI FunctionTool)</text>
  <text x="805" y="619" class="cl mid">search_schema · describe_table · run_sql · tool nghiệp vụ của pack · load_skill · propose_learning</text>

  <line x1="805" y1="631" x2="805" y2="657" class="arrow" marker-end="url(#arr)"/>

  <!-- Data Gateway -->
  <rect x="350" y="660" width="910" height="80" rx="12" fill="#fff7ef" class="new"/>
  <rect x="1214" y="651" width="40" height="18" rx="9" class="badge-new"/>
  <text x="1234" y="664" class="badge-txt">MỚI</text>
  <text x="805" y="686" class="mid" font-size="16" font-weight="700">Data Gateway — điểm thực thi chính sách (policy enforcement point)</text>
  <text x="805" y="708" class="cl mid">sqlglot: đúng 1 câu SELECT · chỉ bảng/cột được phép theo role · chặn cột PII · tự thêm LIMIT · lint quy tắc nghiệp vụ (vd. thiếu lọc status)</text>
  <text x="805" y="726" class="cl mid">ghi Evidence [Q1], [Q2]… cho mỗi truy vấn → thành "Nguồn tham chiếu" của câu trả lời, dùng cho review và eval</text>

  <!-- Platform DB -->
  <rect x="350" y="752" width="910" height="72" rx="12" fill="#f4f4f6" class="new"/>
  <rect x="1214" y="743" width="40" height="18" rx="9" class="badge-new"/>
  <text x="1234" y="756" class="badge-txt">MỚI</text>
  <text x="805" y="779" class="ct mid">Platform DB (Postgres; SQLite khi dev) — lưu bền vững</text>
  <text x="805" y="801" class="cl mid">sessions · runs · traces/spans của CẢ 2 runtime · evals · dagent_evidence · dagent_reviews · dagent_learnings</text>

  <!-- ═════ Tools & Data ═════ -->
