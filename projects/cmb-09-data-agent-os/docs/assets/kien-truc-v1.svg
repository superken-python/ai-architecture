  <text x="1485" y="138" class="mid" font-size="20" font-weight="700" style="fill:#8a4b00">Tools &amp; Data</text>
  <text x="1485" y="162" class="mid" font-size="15" style="fill:#8a4b00">(via MCP / API)</text>

  <rect x="1330" y="185" width="310" height="250" rx="10" fill="#ffffff" stroke="#f2c27a" stroke-width="1.2"/>
  <rect x="1564" y="176" width="70" height="18" rx="9" class="badge-upd"/>
  <text x="1599" y="189" class="badge-txt">CẬP NHẬT</text>
  <text x="1485" y="213" class="ct mid">MCP DBHub 1.4 (bytebase)</text>
  <text x="1348" y="240" class="cm">• execute_sql_&lt;source&gt;</text>
  <text x="1348" y="258" class="cl">   readonly + max_rows theo từng tool</text>
  <text x="1348" y="280" class="cm">• search_objects_&lt;source&gt;</text>
