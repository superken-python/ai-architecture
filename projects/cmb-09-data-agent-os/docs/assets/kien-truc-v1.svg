  <text x="957" y="1027" class="cl mid">quy tắc nghiệp vụ,</text>
  <text x="957" y="1045" class="cl mid">metric chuẩn, lint SQL</text>

  <rect x="1060" y="975" width="182" height="105" rx="10" fill="#ffffff" stroke="#9fd3b0"/>
  <text x="1151" y="1003" class="ct2 mid">dictionary.yaml</text>
  <text x="1151" y="1027" class="cl mid">schema + ý nghĩa,</text>
  <text x="1151" y="1045" class="cl mid">caveat, cột PII</text>

  <rect x="1254" y="975" width="182" height="105" rx="10" fill="#ffffff" stroke="#9fd3b0"/>
  <text x="1345" y="1003" class="ct2 mid">tools.yaml</text>
  <text x="1345" y="1027" class="cl mid">contract của tool</text>
  <text x="1345" y="1045" class="cl mid">→ sinh dbhub.toml</text>

  <rect x="1448" y="975" width="182" height="105" rx="10" fill="#ffffff" stroke="#9fd3b0"/>
  <text x="1539" y="1003" class="ct2 mid">skills/*/SKILL.md</text>
  <text x="1539" y="1027" class="cl mid">chuẩn Agent Skills,</text>
  <text x="1539" y="1045" class="cl mid">progressive disclosure</text>

  <rect x="672" y="1095" width="182" height="105" rx="10" fill="#ffffff" stroke="#9fd3b0"/>
