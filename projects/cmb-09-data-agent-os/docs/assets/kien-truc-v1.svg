  <rect width="1680" height="1240" fill="#ffffff"/>

  <!-- Tiêu đề + chú thích -->
  <text x="20" y="44" class="h1">Data Agent OS — kiến trúc v1</text>
  <text x="20" y="70" class="sub">Cập nhật từ diagram v0 · dự án CMB-09 (text-to-SQL agent) · AgentOS quản lý Agno SDK + OpenAI Agents SDK · dữ liệu qua MCP DBHub</text>
  <rect x="1310" y="30" width="46" height="22" rx="5" fill="#fff7ef" class="new"/>
  <text x="1366" y="46" class="lbl">phần bổ sung / điều chỉnh so với v0</text>
  <rect x="1310" y="60" width="38" height="18" rx="9" class="badge-new"/>
  <text x="1329" y="73" class="badge-txt">MỚI</text>
  <rect x="1354" y="60" width="70" height="18" rx="9" class="badge-upd"/>
  <text x="1389" y="73" class="badge-txt">CẬP NHẬT</text>
  <text x="1432" y="74" class="lbl">(khóa) = kỹ năng core không cho ghi đè</text>

  <!-- ═════ Client / App ═════ -->
