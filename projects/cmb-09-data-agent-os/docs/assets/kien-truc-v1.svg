  <text x="763" y="1027" class="cl mid">id, version, routing,</text>
  <text x="763" y="1045" class="cl mid">datasource, access</text>

  <rect x="866" y="975" width="182" height="105" rx="10" fill="#ffffff" stroke="#9fd3b0"/>
