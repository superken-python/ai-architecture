  <text x="957" y="1165" class="cl mid">(ví dụ mẫu cho agent)</text>

  <rect x="1060" y="1095" width="182" height="105" rx="10" fill="#ffffff" class="new"/>
  <text x="1151" y="1123" class="ct2 mid">reports.yaml</text>
  <text x="1151" y="1147" class="cl mid">workflow báo cáo:</text>
  <text x="1151" y="1165" class="cl mid">SQL cố định + template</text>

  <rect x="1254" y="1095" width="182" height="105" rx="10" fill="#ffffff" stroke="#9fd3b0"/>
