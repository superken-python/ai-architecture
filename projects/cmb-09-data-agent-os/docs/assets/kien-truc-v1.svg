  <!-- ═════ Domain Pack ═════ -->
  <rect x="20" y="890" width="1640" height="330" rx="16" fill="#eff8f2" stroke="#9fd3b0" stroke-width="1.5"/>
  <text x="60" y="930" font-size="24" font-weight="700" style="fill:#146c43">Domain Pack <tspan font-size="18" font-weight="600">(tái sử dụng cho mọi runtime)</tspan></text>
  <text x="60" y="956" class="sub">Business rules • Context • Skills • Templates • Evaluations • Learnings — mỗi pack là một thư mục có version, thay đổi qua PR</text>

  <rect x="40" y="975" width="330" height="228" rx="10" fill="#ffffff" class="new"/>
  <rect x="324" y="966" width="40" height="18" rx="9" class="badge-new"/>
  <text x="344" y="979" class="badge-txt">MỚI</text>
  <text x="205" y="1001" class="ct mid">core = data agent (mặc định)</text>
  <text x="205" y="1019" class="cl mid">luôn nạp TRƯỚC mọi domain pack</text>
  <text x="58" y="1044" class="cm">• clarify-question</text>
  <text x="58" y="1062" class="cm">• schema-discovery</text>
  <text x="58" y="1080" class="cm">• sql-authoring (khóa)</text>
  <text x="58" y="1098" class="cm">• result-validation (khóa)</text>
  <text x="58" y="1116" class="cm">• answer-with-evidence (khóa)</text>
  <text x="58" y="1134" class="cm">• capture-learning · report-writing</text>
  <text x="58" y="1160" class="cl">Quy tắc lõi: chỉ đọc, số liệu phải từ SQL,</text>
  <text x="58" y="1178" class="cl">trích nguồn, không lộ PII, hỏi lại khi mơ hồ</text>

  <line x1="372" y1="1088" x2="398" y2="1088" class="arrow" marker-end="url(#arr)"/>

  <rect x="400" y="975" width="250" height="228" rx="10" fill="#ffffff" stroke="#9fd3b0" stroke-width="1.2"/>
  <text x="525" y="1001" class="ct mid">Domain packs</text>
  <text x="525" y="1030" class="cm mid">timesheet (chấm công)</text>
  <text x="525" y="1052" class="cm mid">finance (tài chính)</text>
  <text x="525" y="1074" class="cm mid">… thêm pack = thêm thư mục</text>
  <text x="525" y="1092" class="cl mid">(mọi domain pack extends core)</text>
  <text x="525" y="1116" class="cl mid">thứ tự nạp:</text>
  <text x="525" y="1134" class="ct2 mid">core → domain → learnings</text>
  <text x="525" y="1160" class="cl mid">skill domain được ghi đè</text>
  <text x="525" y="1178" class="cl mid">skill core chưa khóa</text>

  <!-- 10 thành phần của một pack -->
  <rect x="672" y="975" width="182" height="105" rx="10" fill="#ffffff" stroke="#9fd3b0"/>
