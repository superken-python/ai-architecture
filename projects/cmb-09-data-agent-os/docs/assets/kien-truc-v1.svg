  <text x="1348" y="350" class="cl">Postgres · MySQL · MariaDB</text>
  <text x="1348" y="368" class="cl">SQL Server · Oracle · SQLite</text>
  <text x="1348" y="394" class="warn">BigQuery: DBHub chưa hỗ trợ → cần</text>
  <text x="1348" y="412" class="warn">MCP server khác (vd. MCP Toolbox)</text>

  <rect x="1330" y="450" width="310" height="80" rx="10" fill="#ffffff" stroke="#f2c27a" stroke-width="1.2"/>
  <text x="1485" y="477" class="ct mid">Internal Systems</text>
  <text x="1485" y="499" class="cl mid">ERP, GLPI… qua API / MCP</text>
  <text x="1485" y="516" class="cl mid">(giai đoạn sau)</text>

  <rect x="1330" y="545" width="310" height="80" rx="10" fill="#ffffff" stroke="#f2c27a" stroke-width="1.2"/>
