[project]
name = "video-chu-cai"
version = "0.1.0"
description = "Nhóm 9 · Video hoạt hình dạy 29 chữ cái tiếng Việt, dựng hoàn toàn bằng code: kịch bản → giọng đọc → nhạc → hình"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Đủ để dựng video: vẽ khung hình (Pillow, numpy), đọc kịch bản (PyYAML), giọng đọc + nghe lại bằng ASR (sherpa-onnx).
# ffmpeg là chương trình ngoài, cài bằng trình quản lý gói của hệ điều hành (xem README).
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
  "pyyaml>=6.0",
  # sherpa-onnx cần đúng bản sherpa-onnx-core cùng số (chứa libonnxruntime); khai báo thẳng vì uv.lock không tự
  # ghi được phụ thuộc này của sherpa-onnx 1.13.
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]  # ruff cùng phiên bản với repo gốc

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chu_cai_video"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
